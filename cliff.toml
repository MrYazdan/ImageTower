# git-cliff configuration for Tower
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- Generated automatically by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false

commit_preprocessors = [
    # Strip leading Gitmoji like :sparkles: or :recycle: so conventional commit parser extracts type & scope
    { pattern = '^:[a-z0-9_]+:\s*', replace = '' },
]

commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor", group = "<!-- 2 -->🚜 Refactoring" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^doc|^memo", group = "<!-- 4 -->📚 Documentation" },
    { message = "^test", group = "<!-- 5 -->🧪 Testing" },
    { message = "^chore|^gear", group = "<!-- 6 -->⚙️ Maintenance & Chores" },
    { message = ".*", group = "<!-- 7 -->💼 Other Changes" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
