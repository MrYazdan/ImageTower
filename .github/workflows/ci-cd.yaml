name: CI/CD & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Test Job: Runs on PR, main branch push, and tag push
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          cache: true

      - name: Verify module dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -v -race -coverprofile=coverage.out ./...

  # ---------------------------------------------------------------------------
  # 2. Docker Build & Push:
  #    - Push to main: builds image & pushes 'edge' and 'sha-...' tags to GHCR
  #    - Push to tag (v*): builds multi-arch (linux/amd64, linux/arm64) & pushes semver tags
  # ---------------------------------------------------------------------------
  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            # On main branch: tag as 'edge' and commit SHA for staging / dev testing
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            # On tag (e.g. v1.2.3): tag semantic versions and 'latest'
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. Release & Automated Changelog: Runs only on tag pushes (e.g. v1.0.0)
  # ---------------------------------------------------------------------------
  release:
    name: Generate Changelog & GitHub Release
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Generate full cumulative CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release with Changelog
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          files: |
            CHANGELOG.md
            README.md
            config.example.yaml

      - name: Update CHANGELOG.md on main branch (optional commit)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp CHANGELOG.md /tmp/CHANGELOG.md
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m ":memo: docs(changelog): update CHANGELOG.md for ${{ github.ref_name }}"
            git push origin main
          fi
